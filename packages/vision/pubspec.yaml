name: vision
description: "Reacthome Vision."
version: 2.0.0
publish_to: "none"
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_webrtc: ^1.6.3

  assets:
  glue:
  glue_flutter_ui:
  glue_flutter_material_ui:

  collection: ^1.19.1
  flutter_svg: ^2.2.3
  flutter_weather_bg: ^3.1.0
  fvp: ^0.40.0
  material_symbols_icons: ^4.2960.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.3.3
  uuid: ^4.5.2
  visibility_detector: ^0.4.0+2
  watcher: ^1.2.1
  video_player: ^2.10.1

  material_ui: any
  cupertino_ui: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

